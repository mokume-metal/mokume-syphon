# SPDX-License-Identifier: MIT
#
# 版を出す。**資産を焼くのと pin を張り替えるのは、同じ 1 回でなければならない。**
#
# xcodebuild の出力はビット単位では再現しないので、別の機会に焼いた資産は別の
# checksum になる。だから「先に checksum を書いてから焼く」も「焼いてから後で
# 書く」も成立しない — 後者は**その tag の Package.swift が壊れたまま**になる
# (利用者はその tag を引く)。焼いた値をそのまま同じコミットへ書き、そこへ tag を
# 打つ。この 1 本が短いのはそのためで、人が間に入る余地を作らない。
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '出す版 (例 v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Syphon.xcframework
        run: bash scripts/build-syphon.sh

      - name: Zip and checksum
        id: asset
        run: |
          set -euo pipefail
          cd Frameworks
          zip -qr Syphon.xcframework.zip Syphon.xcframework
          echo "checksum=$(swift package compute-checksum Syphon.xcframework.zip)" >> "$GITHUB_OUTPUT"

      # 焼いた資産を指すように書き換える。**この tag を引いた人が使うのはこの値。**
      #
      # README の使用例に書かれた 2 つの pin も、ここで同じ 1 回に張り替える。あそこが
      # 説明しているのは**利用者が自分の Package.swift に書く 2 行**で、利用者が引くのは
      # released 版である。`main` の値へ手で揃えると、README が名指しした released 版が
      # 要求する mokume と食い違い、**書いてあるとおりに写しても解決しなくなる** (#13)。
      # 両者が食い違わないと言えるのは、版を出すこの瞬間だけである。
      - name: Pin the manifest and the README example to this asset
        env:
          TAG: ${{ inputs.tag }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          tag, checksum = os.environ["TAG"], os.environ["CHECKSUM"]
          # 版の綴りを先に確かめる。README には数字がそのまま載るので、読めない tag を
          # 渡されたまま進むと使用例が壊れた版を出すことになる
          version = tag[1:] if tag.startswith("v") else tag
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"版の綴りとして読めない tag: {tag}"

          path = pathlib.Path("Package.swift")
          source = path.read_text()
          url = (
              "https://github.com/mokume-metal/mokume-syphon/releases/download/"
              f"{tag}/Syphon.xcframework.zip"
          )
          source, urls = re.subn(
              r'url:\n?\s*"https://github\.com/mokume-metal/mokume-syphon/releases/download/[^"]*"',
              f'url:\n            "{url}"', source)
          source, sums = re.subn(r'checksum: "[0-9a-f]{64}"', f'checksum: "{checksum}"', source)
          # 書き換わらなかったら止める。黙って古い資産を指した版を出さないため
          assert urls == 1 and sums == 1, f"pin を書き換えられなかった (url={urls} checksum={sums})"
          path.write_text(source)

          # README が勧める mokume は、**いま出そうとしている版が要求する mokume** である。
          # 一致させる相手が Package.swift なのはこの瞬間だけで、それはこのコミットが
          # そのまま tag になるからである
          upstream = re.search(
              r'mokume\.git", \.upToNextMinor\(from: "([^"]*)"\)', source)
          assert upstream, "Package.swift の mokume への pin を読めない"

          readme = pathlib.Path("README.md")
          example = readme.read_text()
          # mokume\.git" は mokume-syphon\.git" には当たらないので撃ち分けられる
          example, mokume_pins = re.subn(
              r'(mokume\.git", \.upToNextMinor\(from: ")[^"]*(")',
              rf'\g<1>{upstream.group(1)}\g<2>', example)
          example, self_pins = re.subn(
              r'(mokume-syphon\.git", \.upToNextMinor\(from: ")[^"]*(")',
              rf'\g<1>{version}\g<2>', example)
          assert mokume_pins == 1 and self_pins == 1, (
              f"README の使用例を書き換えられなかった (mokume={mokume_pins} self={self_pins})")
          readme.write_text(example)
          PY

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift README.md
          git commit -m "chore(release): $TAG の資産へ pin と使用例を張り替える"
          git push origin HEAD:main
          gh release create "$TAG" Frameworks/Syphon.xcframework.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "\`Syphon.xcframework.zip\` の checksum: \`$CHECKSUM\`

          この tag の \`Package.swift\` は、この資産を指している。"

      # **release を作った後に確かめる。** 資産が上がるまで pin は解決しようがないので、
      # 順序はこれしか無い。落ちたら run が赤くなり、出た版の不備が黙って通らない
      - name: Verify the released pin resolves
        run: |
          set -euo pipefail
          # 手元の成果物があると Package.swift はそちらを見るので、退けてから確かめる
          rm -rf Frameworks/Syphon.xcframework
          swift package purge-cache
          swift build

      # **README の使用例そのものが解決するかを見る。** 上の swift build が確かめるのは
      # このリポジトリの Package.swift であって、利用者が写す 2 行ではない。#13 で壊れたのは
      # 後者だけで、前者は最後まで緑だった。
      #
      # 2 行は**再導出せず README から切り出す** — 利用者が写すのはその 2 行そのものである。
      # 組む先を作業ツリーの外に置くのは #20 と同じ理由 (検査の副産物を git に載せない)。
      # ここも release の後でしか確かめられない — README は今回出した tag を名指ししている
      - name: Verify the README example resolves
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys, tempfile

          readme = pathlib.Path("README.md").read_text()
          lines = re.findall(
              r'^\s*\.package\(url: "https://github\.com/mokume-metal/.*$', readme, re.M)
          # 2 行であることを要求する。切り出せなくなったら黙って「解決した」に倒さない
          assert len(lines) == 2, f"README の使用例から 2 行を切り出せなかった ({len(lines)} 行)"

          root = pathlib.Path(tempfile.mkdtemp(dir=os.environ.get("RUNNER_TEMP") or None))
          (root / "Sources" / "ReadmeExample").mkdir(parents=True)
          (root / "Sources" / "ReadmeExample" / "Empty.swift").write_text("")
          # 版が解決するかだけを見るので、中身は空でよい。床は本体と同じ (mokume の ADR-0009)
          (root / "Package.swift").write_text(
              "// swift-tools-version: 6.2\n"
              "import PackageDescription\n\n"
              "let package = Package(\n"
              '    name: "ReadmeExample",\n'
              '    platforms: [.macOS("26.0")],\n'
              "    dependencies: [\n"
              + "\n".join(f"        {line.strip()}" for line in lines) + "\n"
              "    ],\n"
              '    targets: [.target(name: "ReadmeExample")]\n'
              ")\n")

          print("README の使用例:\n" + "\n".join(lines))
          done = subprocess.run(["swift", "package", "resolve"], cwd=root)
          if done.returncode != 0:
              sys.exit("README の使用例が解決しない — 写した人が同じところで詰まる (#13)")
          print("ok: README の使用例は解決する")
          PY
